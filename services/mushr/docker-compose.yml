services:
  mushr:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    # Locally built (Dockerfile.caddy = caddy + caddy-dns/cloudflare plugin).
    # Tag tracks the CADDY_VERSION build arg so rebuilds are traceable and the
    # previous build stays on disk under its own tag for rollback.
    image: mushr-caddy:2.11.4
    container_name: mushr
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - loft-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8880/config/"]
      interval: 10s
      timeout: 5s
      retries: 3

  mushr-tunnel:
    image: cloudflare/cloudflared:2026.7.3
    container_name: mushr-tunnel
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - loft-proxy
    depends_on:
      mushr:
        condition: service_healthy

  mushr-dns:
    image: drpsychick/dnsmasq:2.93
    container_name: mushr-dns
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN

volumes:
  caddy-data:
  caddy-config:

networks:
  loft-proxy:
    external: true
