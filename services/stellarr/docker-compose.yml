services:
  vpn:
    # UPSTREAM ARCHIVED (github.com/bubuntux/nordvpn, read-only since
    # 2025-11-22). v3.12.3 is the final published tag — this will never
    # receive updates. Replacement tracked in README "Image pinning".
    image: ghcr.io/bubuntux/nordvpn:v3.12.3
    container_name: stellarr-vpn
    cap_add:
      - NET_ADMIN
      - NET_RAW
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - TOKEN=${NORDVPN_TOKEN}
      - CONNECT=NETHERLANDS
      - TECHNOLOGY=NordLynx
      - NETWORK=192.168.86.0/24
    ports:
      # Transmission
      - 9091:9091
      # - 8080:8080  # unknown — uncomment if needed
      - 51413:51413
      - 51413:51413/udp
      # Soulseek (slskd)
      - 5030:5030
      - 50300:50300
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3-r0-ls355
    container_name: transmission
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/transmission:/config
      - /mammoth/downloads:/downloads
      - ./transmission/remove-torrents.sh:/scripts/remove-torrents.sh:ro
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      - vpn

  slskd:
    image: slskd/slskd:0.26.0
    container_name: slskd
    user: "${PUID}:${PGID}"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SOULSEEK_USERNAME=${SLSKD_SOULSEEK_USERNAME}
      - SLSKD_SOULSEEK_PASSWORD=${SLSKD_SOULSEEK_PASSWORD}
      - SLSKD_DOWNLOADS_DIR=/downloads/complete/lidarr
      - SLSKD_INCOMPLETE_DIR=/downloads/incomplete
      - SLSKD_SHARED_DIR=/music
    volumes:
      - /opt/slskd:/app
      - /mammoth/downloads:/downloads
      - /mammoth/library/music:/music:ro
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      - vpn

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls312
    container_name: radarr
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/radarr:/config
      - /mammoth/library/movies:/movies
      - /mammoth/downloads:/downloads
    restart: unless-stopped
    networks:
      - loft-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
    container_name: sonarr
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/sonarr:/config
      - /mammoth/library/tv:/tv
      - /mammoth/downloads:/downloads
    restart: unless-stopped
    networks:
      - loft-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lidarr:
    # Pinned to a *nightly* build on purpose, not the stable line. The
    # database schema here (3.1.2) is ahead of stable (3.1.0.4875-ls36),
    # and Lidarr refuses to open a database written by a newer build — so
    # moving to stable is a downgrade that would fail to start. This is the
    # build that was already running, now frozen instead of drifting.
    # Getting onto the stable line means exporting the library and
    # rebuilding the database: a separate project.
    image: lscr.io/linuxserver/lidarr:nightly-3.1.2.4939-ls197
    container_name: lidarr
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/lidarr:/config
      - /mammoth/library/music:/music
      - /mammoth/downloads:/downloads
    restart: unless-stopped
    networks:
      - loft-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.0-ls356
    container_name: bazarr
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/bazarr:/config
      - /mammoth/library/movies:/movies
      - /mammoth/library/tv:/tv
    restart: unless-stopped
    networks:
      - loft-proxy

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.2268-ls474
    container_name: jackett
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=true
    volumes:
      - /opt/jackett:/config
    restart: unless-stopped
    networks:
      - loft-proxy

networks:
  loft-proxy:
    external: true
