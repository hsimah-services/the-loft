services:
  db:
    # Held on the 12.2 line (12.3.2 is current). Moving minor versions
    # under a live WordPress database is a separate, deliberate migration.
    image: mariadb:12.2.2
    container_name: pupyrus-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - /opt/pupyrus/db:/var/lib/mysql
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Held on 7.x (8.8.x is current). Redis 8 is a major bump for the
    # WordPress object cache — upgrade on its own, not as part of a pin.
    image: redis:7.4.10-alpine
    container_name: pupyrus-redis
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:7.0.2-php8.5-apache
    container_name: pupyrus
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_CACHE', true);
        define('GRAPHQL_JWT_AUTH_SECRET_KEY', '${GRAPHQL_JWT_AUTH_SECRET_KEY}');
    volumes:
      - /opt/pupyrus/html:/var/www/html
    restart: unless-stopped
    networks:
      - default
      - loft-proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cli:
    image: wordpress:cli-2.12.0
    container_name: pupyrus-cli
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - /opt/pupyrus/html:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - cli

networks:
  loft-proxy:
    external: true
